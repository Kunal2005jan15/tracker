<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b10" id="tc"><title>Lean Bulk</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#0a0b10;--s1:#13151c;--s2:#1c1f29;--s3:#2a2e3b;--t:#f2f4f8;--m:#8b92a5;--a:#7c9cff;--a2:#38e1c0;--wn:#ffb454;--bd:#ff6b7a;--g:linear-gradient(135deg,#7c9cff,#38e1c0)}
[data-theme=light]{--bg:#f2f4f9;--s1:#fff;--s2:#eceff6;--s3:#dde1ec;--t:#13161d;--m:#667085;--a:#4560f0;--a2:#0aa88a;--wn:#d98200;--bd:#e5384d;--g:linear-gradient(135deg,#7c9cff,#38e1c0)}
html{font-size:16px}html[data-big="1"]{font-size:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:1rem/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(90px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px 0}
.enter{animation:fin .28s ease-out}@keyframes fin{from{opacity:0;transform:translateY(8px)}}
.enter .rf{animation:rin .9s cubic-bezier(.2,.8,.2,1)}@keyframes rin{from{stroke-dashoffset:var(--C)}}
.card{background:var(--s1);border-radius:20px;padding:14px;margin-bottom:12px}
.h{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--m);margin:20px 4px 8px;font-weight:600}
.ttl{font-size:1.5rem;font-weight:700}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.w{flex-wrap:wrap}
.m{color:var(--m)}.sm{font-size:.8rem}.big2{font-size:1.2rem}
button{font:inherit;background:var(--s2);color:var(--t);border:0;border-radius:12px;padding:11px 14px;transition:transform .08s,opacity .2s}
button:active{transform:scale(.95)}button:disabled{opacity:.3}
button.on{background:var(--a);color:#06101c;font-weight:600}
.pri{background:var(--g);color:#06101c;font-weight:700}
.btn{background:var(--g);color:#06101c;font-weight:700;padding:15px;border-radius:16px;width:100%;font-size:1.05rem}
.ic{padding:8px 10px;font-size:1.3rem;background:none;color:var(--m)}.ic2{width:38px;height:38px;padding:0;font-size:1.2rem}
input,select{font:inherit;background:var(--s2);color:var(--t);border:2px solid transparent;border-radius:12px;padding:10px;width:100%;min-width:0;outline:0}
input:focus{border-color:var(--a)}input[type=number]{-moz-appearance:textfield}
input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
a{color:var(--a);text-decoration:none}
canvas{width:100%;height:220px;display:block;touch-action:pan-y}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--s1);background:color-mix(in srgb,var(--s1) 90%,transparent);backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom);z-index:20;border-top:1px solid var(--s2)}
nav button{flex:1;background:none;border-radius:0;padding:8px 0 7px;font-size:.62rem;color:var(--m)}
nav button b{display:block;font-size:1.15rem;font-weight:400;width:46px;margin:0 auto 1px;border-radius:14px;padding:2px 0;transition:background .2s}
nav button.on{color:var(--t);background:none;font-weight:600}nav button.on b{background:var(--s3)}
.wk{display:flex;gap:5px}.wd{flex:1;text-align:center;padding:8px 0 6px;border-radius:14px;background:var(--s1);font-size:.68rem;color:var(--m)}
.wd b{display:block;font-size:1.05rem;color:var(--t);margin-top:1px}.wd i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0}
.wd.td{box-shadow:inset 0 0 0 1.5px var(--a)}.wd.sel{background:var(--g);color:#06101c}.wd.sel b{color:#06101c}
.chip2{background:var(--s1);padding:7px 12px;border-radius:20px;font-weight:600}
.rings{display:flex;justify-content:space-around;text-align:center}
.na{display:flex;align-items:center;gap:12px}.nai{font-size:1.8rem}
.meal{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--s1);margin-bottom:8px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--s3);flex:none;display:grid;place-items:center;color:transparent;font-weight:700;font-size:.9rem}
.meal.on .chk{background:var(--g);border-color:transparent;color:#06101c}
.cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gl{padding:9px 0;opacity:.28;font-size:1.05rem;background:var(--s2)}.gl.f{opacity:1;background:rgba(90,200,250,.18)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:.75rem;padding:5px 10px;border-radius:20px;background:var(--s2);color:var(--m)}.pill.ok{background:rgba(56,225,192,.15);color:var(--a2)}
.ex summary{display:flex;justify-content:space-between;padding:11px 0;border-top:1px solid var(--s2);list-style:none}
.ex summary::-webkit-details-marker{display:none}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.65rem;color:var(--m)}
.hc{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.72rem;color:var(--t)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}.stat b{font-size:1.15rem}
.lr{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--s2)}.lr:first-child{border:0}
.tip{min-height:1.3em;margin-bottom:6px;font-size:.85rem;color:var(--m)}.tip b{color:var(--t)}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-200%);background:var(--t);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:600;z-index:100;transition:transform .3s;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
#wo{position:fixed;inset:0;z-index:50;background:var(--bg);display:none}
.wcol{max-width:560px;height:100%;margin:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.wtop{display:flex;align-items:center;gap:10px;padding:10px 14px}.wttl{flex:1;text-align:center;display:flex;flex-direction:column}
.segs{display:flex;gap:5px;padding:0 14px 8px}.segs i{flex:1;height:6px;border-radius:3px;background:var(--s3)}.segs i.cur{background:var(--a)}.segs i.full{background:var(--a2)}
.wbody{flex:1;overflow:auto;padding:6px 14px 16px}
.wfoot{display:flex;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}.wfoot .btn{flex:1;width:auto}.nv{width:56px;flex:none;font-size:1.5rem}
.wbody h1{margin:4px 0 2px;font-size:1.7rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{padding:8px 12px;border-radius:12px;background:var(--s2);font-size:.85rem;color:var(--m)}.chip.dn{color:var(--t);border:1px solid var(--a2)}.chip.cr{background:var(--a);color:#06101c;font-weight:700}
.scard{background:var(--s1);border-radius:22px;padding:16px}
.lbl{color:var(--m);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.step{display:flex;gap:10px;align-items:center;margin:6px 0 14px}.step button{width:64px;height:64px;font-size:1.8rem;border-radius:18px;padding:0;flex:none}
.step input{height:64px;text-align:center;font-size:1.8rem;font-weight:700}
.restb{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:18px;padding:10px 14px;margin:0 14px;border:1.5px solid var(--a)}
.restb .big{font-size:1.6rem;font-weight:700;flex:1}
.sumg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.sumg div{background:var(--s1);border-radius:18px;padding:16px;text-align:center}.sumg b{display:block;font-size:1.7rem}
</style></head><body>
<main id="app"></main><nav id="nav"></nav><div id="wo"></div><div id="toast"></div>
<script>
const TABS=[["today","🏠","Today"],["diet","🍛","Diet"],["train","🏋️","Train"],["prog","📈","Progress"],["hist","🗓️","History"],["more","⚙️","More"]];
const MEALS=[
{n:"Morning shake",t:"After waking",k:550,p:21,it:["1 glass full-cream milk (boiled, cooled)","1 large banana","2 tbsp peanut butter","30g oats"]},
{n:"Lunch",t:"Main carb meal",k:780,p:29,it:["2 big bowls rice","1 big bowl thick dal","Sabzi","1 cup dahi (or 100g paneer)"]},
{n:"Evening / pre-workout",t:"~1h before training",k:480,p:14,it:["4 chapati","Sabzi","Creatine 3g with water"],pick:{veg:["100g paneer (or 40g soya chunks)",265,18],egg:["2 whole eggs, boiled or omelette",140,12],non:["2 whole eggs, boiled or omelette",140,12]}},
{n:"Dinner",t:"Recovery",k:420,p:16,it:["1 bowl rice OR 3 chapati","1 bowl thick dal","Sabzi"],pick:{veg:["100g roasted chana",360,19],egg:["100g roasted chana",360,19],non:["100g chicken breast",165,31]}}];
const EX={
"Goblet Squat":{m:"Quads, glutes",sets:4,lo:15,hi:20,c:"Hold 10kg DB at chest, elbows inside knees, sit between your hips, chest tall, 4s down."},
"Barbell RDL":{m:"Hamstrings, glutes",sets:4,lo:12,hi:15,c:"Soft knees, push hips back, bar slides down thighs, feel the hamstring stretch, flat back. 4s down."},
"DB Overhead Press":{m:"Shoulders",sets:3,lo:12,hi:15,c:"Seated, ribs down, press up and slightly back, don't arch."},
"Lateral Raise":{m:"Side delts (V-taper)",sets:4,lo:15,hi:20,c:"Lean slightly forward, lead with elbows, raise to shoulder height, 4s down. No swinging."},
"Floor DB Press":{m:"Chest, triceps",sets:4,lo:15,hi:20,c:"Elbows ~45° from torso, pause on the floor, squeeze chest at top."},
"Deficit Push-up":{m:"Chest",sets:3,lo:10,hi:25,r:"failure",bw:1,c:"Hands on DB handles, chest dips below hands, body in a straight line."},
"Barbell Row":{m:"Lats, upper back",sets:4,lo:12,hi:15,c:"Hinge to ~45°, pull bar to belly button, squeeze shoulder blades, 4s down."},
"Rear Delt Fly":{m:"Rear delts",sets:3,lo:15,hi:20,c:"Bent over, slight elbow bend, raise out to the sides, pinky up."},
"Snatch-Grip Deadlift":{m:"Back, glutes, hamstrings",sets:4,lo:12,hi:15,c:"Very wide grip, hips lower than a normal deadlift, neutral spine always. Stop the set if form breaks."},
"Single-Arm Row":{m:"Lower lats",sets:3,lo:12,hi:15,r:"12-15/side",c:"Support with the other hand, drive elbow to hip, pause at top."},
"Bicep Curl":{m:"Biceps",sets:3,lo:12,hi:15,c:"Elbows pinned to sides, no swing, 4s down."},
"Overhead Tricep Ext":{m:"Triceps",sets:3,lo:12,hi:15,c:"Elbows pointing forward, lower behind head to a deep stretch."}};
const PLAN={A:{n:"A · Shoulders + Legs",d:["Goblet Squat","Barbell RDL","DB Overhead Press","Lateral Raise"]},
B:{n:"B · Back + Chest",d:["Floor DB Press","Deficit Push-up","Barbell Row","Rear Delt Fly"]},
C:{n:"C · Deadlift + Arms",d:["Snatch-Grip Deadlift","Single-Arm Row","Bicep Curl","Overhead Tricep Ext"]}};
const MF=[["sh","Shoulders"],["ch","Chest"],["wa","Waist"],["ar","Arm"],["th","Thigh"]];

const $=id=>document.getElementById(id);
const DEF={w:{},m:{},d:{},s:{mode:"egg",rate:1.5,water:12,start:null,goal:null,rest:90,bk:0,theme:"auto",big:0}};
function load(){let r=null;try{r=JSON.parse(localStorage.getItem("lb2"))}catch(e){}
 if(!r){r=JSON.parse(JSON.stringify(DEF));try{const o=JSON.parse(localStorage.getItem("lb"));if(o&&o.w)r.w=o.w}catch(e){}}
 r.s=Object.assign({},DEF.s,r.s);r.m=r.m||{};r.d=r.d||{};r.w=r.w||{};return r}
let S=load();
const save=()=>{try{localStorage.setItem("lb2",JSON.stringify(S))}catch(e){toast("Could not save (storage full/blocked)")}};
const iso=d=>d.toLocaleDateString("en-CA"),parse=s=>new Date(s+"T00:00:00");
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const defType=s=>({1:"A",3:"B",5:"C"})[parse(s).getDay()]||null;
let date=iso(new Date()),tab="today",pe="Goblet Squat",anim=true;
const peek=s=>S.d[s||date]||{meals:[0,0,0,0],water:0,cr:0,sleep:"",type:defType(s||date),ex:{}};
const D=s=>{s=s||date;return S.d[s]=S.d[s]||{meals:[0,0,0,0],water:0,cr:0,sleep:"",type:defType(s),ex:{}}};
const done=a=>(a||[]).filter(s=>s&&s.r>0).map(s=>({k:s.k||0,r:s.r}));
const vol=d=>Math.round(Object.values(d.ex||{}).reduce((a,arr)=>a+done(arr).reduce((b,s)=>b+s.k*s.r,0),0));
const est=x=>x.k>0?x.k*(1+x.r/30):x.r;
const fd=(s,o)=>parse(s).toLocaleDateString("en-GB",o||{weekday:"short",day:"numeric",month:"short"});
const fd2=t=>new Date(t).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2300)}
function applyTheme(){let t=S.s.theme;if(t=="auto")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
 document.documentElement.dataset.theme=t;document.documentElement.dataset.big=S.s.big?1:0;$("tc").content=t=="light"?"#f2f4f9":"#0a0b10"}

function mealInfo(i){const m=MEALS[i];let k=m.k,p=m.p;const it=m.it.slice();
 if(m.pick){const x=m.pick[S.s.mode];it.splice(i==2?2:it.length,0,x[0]);k+=x[1];p+=x[2]}return{k,p,it}}
const plan=()=>{let k=0,p=0;MEALS.forEach((_,i)=>{const m=mealInfo(i);k+=m.k;p+=m.p});return{k,p}};
const tot=s=>{let k=0,p=0;peek(s).meals.forEach((v,i)=>{if(v){const m=mealInfo(i);k+=m.k;p+=m.p}});return{k,p}};
function streak(){const ok=s=>S.d[s]&&S.d[s].meals.filter(Boolean).length>=3;let n=0,s=iso(new Date());if(!ok(s))s=addDays(s,-1);while(ok(s)){n++;s=addDays(s,-1)}return n}
const needBk=()=>Object.keys(S.d).length>=5&&Date.now()-(S.s.bk||0)>14*864e5;
function prevW(){const k=Object.keys(S.w).filter(x=>x<date).sort();return k.length?S.w[k[k.length-1]]:null}

/* maths */
const W=()=>Object.entries(S.w).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,v])=>[parse(d).getTime(),v,d]);
const ma7=w=>w.map(p=>{const s=w.filter(q=>q[0]<=p[0]&&q[0]>p[0]-7*864e5);return[p[0],s.reduce((a,q)=>a+q[1],0)/s.length]});
function rate(){const w=W();if(w.length<3)return null;const last=w[w.length-1][0],r=w.filter(p=>p[0]>=last-28*864e5);
 if(r.length<3||r[r.length-1][0]-r[0][0]<10*864e5)return null;
 const n=r.length,xs=r.map(p=>(p[0]-r[0][0])/864e5),ys=r.map(p=>p[1]),mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
 let nu=0,de=0;xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2});return de?nu/de*30:null}
function advice(){const r=rate();
 if(r===null)return"Log weight 3+ times over 10+ days (same time daily) to get a reliable rate.";
 if(r<0.8)return`${r.toFixed(2)} kg/month is too slow. Add ~250 kcal/day (extra glass of milk + 1 tbsp peanut butter).`;
 if(r>2.2)return`${r.toFixed(2)} kg/month is fast, so some of it is probably fat. Trim ~200 kcal/day.`;
 return`${r.toFixed(2)} kg/month is on target. Keep the plan.`}
function weekly(){const w=W();if(!w.length)return[];const t0=w[0][0],o={};
 w.forEach(p=>{const k=Math.floor((p[0]-t0)/(7*864e5));(o[k]=o[k]||[]).push(p[1])});
 let prev=null;return Object.keys(o).map(Number).sort((a,b)=>a-b).map(k=>{const a=o[k].reduce((x,y)=>x+y)/o[k].length,r={k:k+1,a,d:prev===null?null:a-prev};prev=a;return r}).slice(-8)}
function mfl(k){const e=Object.entries(S.m).sort((a,b)=>a[0]<b[0]?-1:1).filter(([_,v])=>v[k]>0);return e.length?[e[0][1][k],e[e.length-1][1][k]]:null}
function lastSess(n){const ds=Object.keys(S.d).filter(x=>x<date&&done((S.d[x].ex||{})[n]).length).sort();const x=ds[ds.length-1];return x?{d:x,s:done(S.d[x].ex[n])}:null}
function tip(n,l){const e=EX[n];if(!l)return`First time: pick a load you can lift for ${e.lo} clean reps with a 4s lowering.`;
 if(l.s.length>=e.sets&&l.s.every(s=>s.r>=e.hi))return`All sets hit ${e.hi}. Try a 5s lowering, a 1s pause at the stretch, or a harder variant.`;
 return`Beat last time: aim for ${Math.min(...l.s.map(s=>s.r))+1}+ reps on every set.`}
function exHist(n){return Object.keys(S.d).sort().map(s=>{const a=done((S.d[s].ex||{})[n]);return a.length?[parse(s).getTime(),Math.max(...a.map(est))]:null}).filter(Boolean)}
function prs(){const o=[];Object.keys(EX).forEach(n=>{let b=null;Object.keys(S.d).sort().forEach(s=>{done((S.d[s].ex||{})[n]).forEach(x=>{const v=est(x);if(!b||v>b.v)b={v,k:x.k,r:x.r,s}})});if(b)o.push([n,b])});return o}
function bestBefore(n){let b=null;Object.keys(S.d).forEach(s=>{if(s>=date)return;done((S.d[s].ex||{})[n]).forEach(x=>{const v=est(x);if(b===null||v>b)b=v})});return b}

/* handlers */
function go(t){tab=t;anim=true;render();scrollTo(0,0)}
function goDay(s){date=s;tab="today";anim=true;render();scrollTo(0,0)}
function sh(n){date=addDays(date,n);render()}
function tm(i,v){D().meals[i]=v?1:0;save();vib(12);render()}
function tc(v){D().cr=v?1:0;save();vib(12);render()}
function wt(n){const d=D();d.water=Math.max(0,d.water+n);save();render()}
function setWt(n){const d=D();d.water=d.water==n?n-1:n;save();vib(8);render()}
function slp(n){const d=D();d.sleep=Math.min(14,Math.max(0,(+d.sleep||7.5)+n));save();render()}
function setW(v){v?S.w[date]=+v:delete S.w[date];save();render()}
function setType(t){D().type=t=="R"?null:t;save();render()}
function setMode(m){S.s.mode=m;save();render()}
function setS(k,v){S.s[k]=v===""?DEF.s[k]:+v;save();render()}
function setOpt(k,v){S.s[k]=v;save();render()}
function focusW(){const e=$("wi");if(e){e.focus();e.scrollIntoView({block:"center"})}}
function saveM(){const o=S.m[date]||{};MF.forEach(([k])=>{const v=$("m_"+k).value;if(v)o[k]=+v});S.m[date]=o;save();toast("Measurements saved");render()}
function clr(){if(confirm("Clear all data for "+date+"?")){delete S.d[date];delete S.w[date];delete S.m[date];save();render()}}
function exp(){S.s.bk=Date.now();save();navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Backup copied. Paste into Notes."))}
function dl(){S.s.bk=Date.now();save();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="leanbulk-"+iso(new Date())+".json";a.click()}
function imp(){const t=prompt("Paste backup JSON (replaces current data)");if(t)ld(t)}
function impF(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>ld(r.result);r.readAsText(f)}
function ld(t){try{const o=JSON.parse(t);if(!o.d||!o.w)throw 0;localStorage.setItem("lb2",t);S=load();render();toast("Restored")}catch(e){toast("Invalid backup")}}
function reset(){if(confirm("Erase ALL data?")&&confirm("Really? This cannot be undone.")){localStorage.removeItem("lb2");S=load();render()}}

/* ring + charts */
function ring(f,sz,st,col,a,b){const r=(sz-st)/2,C=2*Math.PI*r,o=C*(1-Math.min(1,Math.max(0,f))),c=sz/2;
 return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--s3)" stroke-width="${st}"/><circle class="rf" cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${col};--C:${C}" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${o}" transform="rotate(-90 ${c} ${c})"/><text x="50%" y="47%" text-anchor="middle" dominant-baseline="middle" style="fill:var(--t)" font-size="${sz*.2}" font-weight="700">${a}</text><text x="50%" y="66%" text-anchor="middle" dominant-baseline="middle" style="fill:var(--m)" font-size="${sz*.115}">${b}</text></svg>`}
const CH={};
const cv=n=>n[0]=="-"?getComputedStyle(document.documentElement).getPropertyValue(n).trim():n;
function plot(id,series,opt){const c=$(id);if(!c)return;const all=series.flatMap(s=>s.p);if(!all.length)return;
 const dpr=devicePixelRatio||1,Wd=c.clientWidth,H=c.clientHeight;c.width=Wd*dpr;c.height=H*dpr;
 let t0=Math.min(...all.map(p=>p[0])),t1=Math.max(...all.map(p=>p[0]));if(t1-t0<7*864e5)t1=t0+7*864e5;
 let mn=Math.min(...all.map(p=>p[1])),mx=Math.max(...all.map(p=>p[1]));const pd=(mx-mn)*.15||1;mn-=pd;mx+=pd;
 const L=36,B=22,X=t=>L+(t-t0)/(t1-t0)*(Wd-L-10),Y=v=>H-B-(v-mn)/(mx-mn)*(H-B-10);
 CH[id]={series,X,Y,t0,t1,mn,mx,H,Wd,L,B,opt,dpr};paint(id,-1)}
function paint(id,hi){const q=CH[id],c=$(id);if(!q||!c)return;const x=c.getContext("2d"),{series,X,Y,t0,t1,mn,mx,H,Wd,L,B,opt,dpr}=q;
 x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,Wd,H);x.font="11px system-ui";x.lineWidth=1;x.textAlign="left";x.setLineDash([]);
 for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;x.strokeStyle=cv("--s3");x.beginPath();x.moveTo(L,Y(v));x.lineTo(Wd-10,Y(v));x.stroke();x.fillStyle=cv("--m");x.fillText(v.toFixed(1),0,Y(v)+4)}
 x.fillStyle=cv("--m");x.fillText(fd2(t0),L,H-6);x.textAlign="right";x.fillText(fd2(t1),Wd-10,H-6);x.textAlign="left";
 series.forEach(s=>{const col=cv(s.c);x.strokeStyle=col;x.fillStyle=col;x.lineWidth=s.w||2;x.setLineDash(s.dash||[]);x.lineJoin="round";
  if(s.line!==false&&s.p.length>1){x.beginPath();s.p.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.stroke();
   if(s.fill){x.lineTo(X(s.p[s.p.length-1][0]),H-B);x.lineTo(X(s.p[0][0]),H-B);x.closePath();x.globalAlpha=.12;x.fill();x.globalAlpha=1}}
  x.setLineDash([]);if(s.dots)s.p.forEach(p=>{x.beginPath();x.arc(X(p[0]),Y(p[1]),s.line===false?2.5:3.5,0,7);x.fill()})});
 if(hi>=0){const p=series[opt.main].p[hi];x.strokeStyle=cv("--t");x.globalAlpha=.4;x.lineWidth=1;x.beginPath();x.moveTo(X(p[0]),4);x.lineTo(X(p[0]),H-B);x.stroke();x.globalAlpha=1;x.fillStyle=cv("--t");x.beginPath();x.arc(X(p[0]),Y(p[1]),5,0,7);x.fill()}}
function hook(id,tid){const c=$(id);if(!c||!CH[id])return;const h=e=>{const q=CH[id],r=c.getBoundingClientRect(),px=e.clientX-r.left,pts=q.series[q.opt.main].p;let bi=0,bd=1e9;
 pts.forEach((p,i)=>{const d=Math.abs(q.X(p[0])-px);if(d<bd){bd=d;bi=i}});paint(id,bi);$(tid).innerHTML=q.opt.fmt(pts[bi])};c.onpointerdown=h;c.onpointermove=h}
function drawProg(){const w=W();
 if(w.length){const m=ma7(w),mm={};m.forEach(p=>mm[p[0]]=p[1]);const w0=S.s.start||w[0][1],t0=w[0][0],tE=Math.max(w[w.length-1][0],t0+7*864e5);
  plot("cw",[{p:w.map(p=>[p[0],p[1]]),c:"--m",line:false,dots:true},{p:m,c:"--a",w:3,fill:true},{p:[[t0,w0],[tE,w0+S.s.rate*(tE-t0)/864e5/30]],c:"--a2",dash:[5,5],w:1.5}],
  {main:0,fmt:p=>`${fd2(p[0])} · <b>${p[1]} kg</b> · 7d avg ${mm[p[0]].toFixed(1)}`});hook("cw","tcw")}
 const h=exHist(pe);if(h.length){plot("cs",[{p:h,c:"--wn",w:2.5,dots:true}],{main:0,fmt:p=>`${fd2(p[0])} · <b>${p[1].toFixed(1)}</b>`});hook("cs","tcs")}}

 return h+`</div><button class=ic onclick="sh(7)">›</button></div>`}

const RC=2*Math.PI*24;
function startPlan(k){D().type=k;save();openWO()}
function openWO(){const d=peek();if(!d.type){toast("Rest day. Pick A, B or C first");return}
 const names=PLAN[d.type].d;wi=Math.max(0,names.findIndex(n=>done((d.ex||{})[n]).length<EX[n].sets));
 woOpen=true;woSum=false;editIdx=null;drKey="";history.pushState({wo:1},"");renderWO()}
function closeWO(){woOpen=false;skipRest();renderWO();if(history.state&&history.state.wo)history.back();render()}
addEventListener("popstate",()=>{if(woOpen){woOpen=false;skipRest();renderWO();render()}});
function finishWO(){woSum=true;renderWO()}
function wgo(i){wi=i;editIdx=null;drKey="";renderWO()}
function wmove(n){const d=peek(),len=PLAN[d.type].d.length;wgo(Math.min(len-1,Math.max(0,wi+n)))}
function editSet(i){editIdx=i;drKey="";renderWO()}
function readDraft(){const a=$("inK"),b=$("inR");if(a)DR.k=+a.value||0;if(b)DR.r=Math.round(+b.value)||0}
function adj(f,v){readDraft();DR[f]=Math.max(0,Math.round((DR[f]+v)*10)/10);$("in"+f.toUpperCase()).value=DR[f];vib(5)}
function initDraft(n,cur,arr,l){const e=EX[n];let s=null;
 if(arr[cur]&&arr[cur].r>0)s=arr[cur];else if(cur>0&&arr[cur-1]&&arr[cur-1].r>0)s=arr[cur-1];else if(l)s=l.s[cur]||l.s[l.s.length-1];
 return{k:(s&&s.k)||0,r:(s&&s.r)||e.lo}}
function curSet(arr,n){if(editIdx!=null)return editIdx;for(let i=0;i<EX[n].sets;i++)if(!(arr[i]&&arr[i].r>0))return i;return -1}
function completeSet(){readDraft();if(DR.r<=0){toast("Enter reps first");return}
 const d=D(),names=PLAN[d.type].d,n=names[wi],a=d.ex[n]=d.ex[n]||[],i=curSet(a,n);if(i<0)return;
 const pb=bestBefore(n);a[i]={k:DR.k,r:DR.r};save();
 const key=date+"|"+n;let msg=null;if(pb!==null&&est(DR)>pb&&!PRS[key]){PRS[key]=1;msg="🏆 New PR on "+n+"!";vib([80,60,80,60,200])}else vib(20);
 editIdx=null;drKey="";
 const all=names.every(x=>done(d.ex[x]).length>=EX[x].sets);
 if(!all)rest(S.s.rest);else{skipRest();msg=msg||"Workout complete 💪"}
 if(msg)toast(msg);renderWO()}
function rest(sec){rtot=sec;re=Date.now()+sec*1000;clearInterval(rt);rt=setInterval(tick,250)}
function addRest(s){if(re){re+=s*1000;rtot+=s;tick()}}
function skipRest(){clearInterval(rt);re=0;if(woOpen)renderWO()}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();a.close()},260)}catch(e){}}
function tick(){const l=Math.ceil((re-Date.now())/1000),t=$("rtx"),f=$("rfg");
 if(l<=0){clearInterval(rt);re=0;beep();vib([250,100,250]);toast("Rest over. Go!");if(woOpen)renderWO();return}
 if(t)t.textContent=Math.floor(l/60)+":"+String(l%60).padStart(2,"0");if(f)f.style.strokeDashoffset=RC*(1-l/rtot)}
function renderWO(){const el=$("wo");
 if(!woOpen){el.style.display="none";document.body.style.overflow="";return}
 el.style.display="block";document.body.style.overflow="hidden";const d=peek(),pl=PLAN[d.type],names=pl.d;
 if(woSum){let sets=0,full=0;names.forEach(n=>{const c=done((d.ex||{})[n]).length;sets+=c;if(c>=EX[n].sets)full++});
  const prc=Object.keys(PRS).filter(k=>k.startsWith(date+"|")).length;
  el.innerHTML=`<div class=wcol><div class=wbody style="text-align:center;padding-top:60px"><div style="font-size:3.5rem">${sets?"💪":"🤔"}</div><h1>${sets?"Workout complete":"Nothing logged yet"}</h1><div class=m>${pl.n}</div>
  <div class=sumg><div><b>${sets}</b><span class="m sm">sets</span></div><div><b>${vol(d)}</b><span class="m sm">volume (kg·reps)</span></div><div><b>${full}/${names.length}</b><span class="m sm">exercises done</span></div><div><b>${prc}</b><span class="m sm">🏆 new PRs</span></div></div></div>
  <div class=wfoot><button class=nv style="width:auto;font-size:1rem;padding:0 18px" onclick="woSum=false;renderWO()">Back</button><button class=btn onclick="closeWO()">Done</button></div></div>`;return}
 const n=names[wi],e=EX[n],arr=(d.ex||{})[n]||[],l=lastSess(n),cur=curSet(arr,n),last=wi==names.length-1;
 if(cur>=0){const key=date+"|"+n+"|"+cur+"|"+(editIdx!=null?1:0);if(drKey!=key){DR=initDraft(n,cur,arr,l);drKey=key}}
 const segs=names.map((x,i)=>`<i class="${i==wi?"cur ":""}${done((d.ex||{})[x]).length>=EX[x].sets?"full":""}" onclick="wgo(${i})"></i>`).join("");
 let chips="";for(let i=0;i<e.sets;i++){const s=arr[i];chips+=s&&s.r>0?`<button class="chip dn" onclick="editSet(${i})">✓ ${i+1} · ${s.k?s.k+"kg × ":""}${s.r}</button>`:`<span class="chip${i==cur?" cr":""}">${i+1}</span>`}
 let rb="";if(re>Date.now()){const lf=Math.ceil((re-Date.now())/1000);
  rb=`<div class=restb><svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" style="stroke:var(--s3)" stroke-width="5"/><circle id=rfg cx="28" cy="28" r="24" fill="none" style="stroke:var(--a2)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${RC}" stroke-dashoffset="${RC*(1-lf/rtot)}" transform="rotate(-90 28 28)"/></svg><span class=big id=rtx>${Math.floor(lf/60)}:${String(lf%60).padStart(2,"0")}</span><button onclick="addRest(15)">+15s</button><button onclick="skipRest()">Skip</button></div>`}
 const setCard=cur>=0?`<div class=scard><div class="row sp"><b>Set ${cur+1} of ${e.sets}</b><span class="m sm">target ${e.r||e.lo+"–"+e.hi} reps</span></div>
  <div class=lbl style="margin-top:12px">Weight (kg)${e.bw?" · 0 = bodyweight":""}</div><div class=step><button onclick="adj('k',-1)">−</button><input id=inK type=number inputmode=decimal step=0.5 value="${DR.k}"><button onclick="adj('k',1)">+</button></div>
  <div class=lbl>Reps</div><div class=step style="margin-bottom:0"><button onclick="adj('r',-1)">−</button><input id=inR type=number inputmode=numeric value="${DR.r}"><button onclick="adj('r',1)">+</button></div></div>`
  :`<div class=scard style="text-align:center"><div style="font-size:2rem">✅</div><b>All sets done</b><div class="m sm">Tap a set above to edit it.</div></div>`;
 el.innerHTML=`<div class=wcol><div class=wtop><button onclick="closeWO()">✕</button><div class=wttl><b>${pl.n}</b><span class="m sm">Exercise ${wi+1} of ${names.length}</span></div><button onclick="finishWO()">Finish</button></div><div class=segs>${segs}</div>
 <div class=wbody><h1>${n}</h1><div class="m sm">${e.m} · ${e.sets} × ${e.r||e.lo+"–"+e.hi} · 4s lowering · <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(n+" form")}" target=_blank>▶ demo</a></div>
 <details style="margin-top:8px"><summary class="m sm">Form cues</summary><div class=sm style="margin-top:4px;line-height:1.5">${e.c}</div></details>
 <div class="m sm" style="margin-top:10px">${l?"Last ("+fd2(parse(l.d).getTime())+"): "+l.s.map(s=>(s.k?s.k+"×":"")+s.r).join(", ")+"<br>":""}💡 ${tip(n,l)}</div>
 <div class=chips>${chips}</div>${setCard}</div>${rb}
 <div class=wfoot><button class=nv onclick="wmove(-1)" ${wi==0?"disabled":""}>‹</button>${cur<0?(last?`<button class=btn onclick="finishWO()">Finish workout</button>`:`<button class=btn onclick="wmove(1)">Next exercise ›</button>`):`<button class=btn onclick="completeSet()">${editIdx!=null?"Update":"Complete"} set ${cur+1} / ${e.sets}</button>`}<button class=nv onclick="wmove(1)" ${last?"disabled":""}>›</button></div></div>`}

/* ---------- render ---------- */
function render(){const y=scrollY;applyTheme();
 $("nav").innerHTML=TABS.map(([k,i,l])=>`<button class="${tab==k?"on":""}" onclick="go('${k}')"><b>${i}</b>${l}</button>`).join("");
 $("app").className=anim?"enter":"";anim=false;
 $("app").innerHTML=({today:vToday,diet:vDiet,train:vTrain,prog:vProg,hist:vHist,more:vMore})[tab]();
 if(tab=="prog")drawProg();scrollTo(0,y)}
addEventListener("resize",()=>{if(tab=="prog")drawProg()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol=="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script></body></html>
